<style>:root{
  --bg0:#050816;--bg1:#0a1230;
  --pink:#E3195C;--blue:#4FA3DC;--orange:#EA650A;--green:#86C13C;--yellow:#F9C80E;--purple:#7A62AA;--teal:#52B3BA;
  --hud:#6FE3EC;--hud2:rgba(111,227,236,.55);--hudline:rgba(111,227,236,.28);--hudbg:rgba(10,26,48,.62);
  --titan:#E8A64F;--ok:#7CE38B;--bad:#FF5C7A;
  --txt:#EEF6FF;--muted:rgba(214,230,255,.62);
  --u:min(1vw,1.7778vh);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg0);color:var(--txt);font-family:'Rubik',system-ui,sans-serif;overflow:hidden}
body{background:
  radial-gradient(55% 60% at 0% 55%,rgba(232,166,79,.20),transparent 70%),
  radial-gradient(45% 45% at 100% 0%,rgba(79,163,220,.16),transparent 70%),
  radial-gradient(40% 40% at 60% 100%,rgba(122,98,170,.16),transparent 70%),
  linear-gradient(180deg,var(--bg1),var(--bg0))}
#stars{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
#fx{position:fixed;inset:0;width:100%;height:100%;z-index:50;pointer-events:none}
#app{position:relative;z-index:1;height:100%}
button{font-family:inherit;cursor:pointer;border:0;color:inherit;background:none}
input{font-family:inherit}
.num{font-variant-numeric:tabular-nums}
bdi.n{unicode-bidi:isolate;direction:ltr}
@keyframes rise{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}
@keyframes pop{0%{opacity:0;transform:scale(.5)}70%{transform:scale(1.06)}100%{opacity:1;transform:scale(1)}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}
@keyframes flick{0%,100%{transform:scaleX(1) scaleY(1)}30%{transform:scaleX(.86) scaleY(.9)}60%{transform:scaleX(1.08) scaleY(1.05)}}
@keyframes shake{0%,100%{transform:translate(0,0)}25%{transform:translate(1px,-1px)}50%{transform:translate(-1px,1px)}75%{transform:translate(1px,1px)}}
@keyframes scan{from{background-position:0 0}to{background-position:0 6px}}
@keyframes sweep{from{transform:translateY(-100%)}to{transform:translateY(100%)}}
@keyframes land{from{transform:translateY(-60vh) scale(.6) rotate(-90deg);opacity:0}60%{opacity:1}to{transform:none;opacity:1}}
.a-rise{animation:rise .6s cubic-bezier(.2,.8,.2,1) both}
.a-pop{animation:pop .5s cubic-bezier(.2,.8,.2,1) both}

/* ---------- HUD panel ---------- */
.hud{position:relative;background:linear-gradient(180deg,rgba(14,34,62,.66),rgba(8,20,40,.62));border:1px solid var(--hudline);border-radius:calc(var(--u)*.9);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);overflow:hidden}
.hud:before{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(180deg,rgba(111,227,236,.045) 0 1px,transparent 1px 3px);animation:scan 1.2s linear infinite;z-index:0}
.hud>*{position:relative;z-index:1}
.brk{position:absolute;width:calc(var(--u)*1.6);height:calc(var(--u)*1.6);border:2px solid var(--hud);z-index:2;pointer-events:none}
.brk.tr{top:-1px;right:-1px;border-left:0;border-bottom:0;border-top-right-radius:calc(var(--u)*.9)}
.brk.tl{top:-1px;left:-1px;border-right:0;border-bottom:0;border-top-left-radius:calc(var(--u)*.9)}
.brk.br{bottom:-1px;right:-1px;border-left:0;border-top:0;border-bottom-right-radius:calc(var(--u)*.9)}
.brk.bl{bottom:-1px;left:-1px;border-right:0;border-top:0;border-bottom-left-radius:calc(var(--u)*.9)}
.tag{display:inline-flex;align-items:center;gap:calc(var(--u)*.6);font-size:calc(var(--u)*1.05);font-weight:700;letter-spacing:.12em;color:var(--hud)}
.tag i{width:calc(var(--u)*.6);height:calc(var(--u)*.6);border-radius:50%;background:var(--hud);box-shadow:0 0 10px var(--hud);animation:blink 1.4s infinite}

/* ---------- host layout ---------- */
.host{height:100%;display:flex;flex-direction:column;padding:calc(var(--u)*1.4) calc(var(--u)*2.2) calc(var(--u)*1.4)}
.hdr{display:flex;align-items:center;justify-content:space-between;height:calc(var(--u)*5);flex:0 0 auto;gap:calc(var(--u)*1.4)}
.hdr .logo{height:calc(var(--u)*4.2)}
.hdr .mid{flex:1;display:flex;justify-content:center}
.hdr .ctrls{display:flex;align-items:center;gap:calc(var(--u)*.7)}
.chipc{display:inline-flex;align-items:center;gap:calc(var(--u)*.6);padding:calc(var(--u)*.55) calc(var(--u)*1.2);border-radius:calc(var(--u)*.6);font-size:calc(var(--u)*1.15);color:var(--muted);border:1px solid var(--hudline);background:var(--hudbg)}
.chipc b{color:var(--txt);font-weight:800;letter-spacing:.08em}
.ibtn{width:calc(var(--u)*3.2);height:calc(var(--u)*3.2);border-radius:calc(var(--u)*.7);display:grid;place-items:center;background:var(--hudbg);border:1px solid var(--hudline);transition:.2s}
.ibtn:hover{border-color:var(--hud)}
.ibtn svg{width:48%;height:48%;fill:none;stroke:var(--hud);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.btn{font-weight:800;font-size:calc(var(--u)*1.35);padding:calc(var(--u)*.8) calc(var(--u)*1.9);border-radius:calc(var(--u)*.7);display:inline-flex;align-items:center;gap:calc(var(--u)*.7);transition:transform .15s,filter .2s,opacity .2s;letter-spacing:.02em}
.btn:hover{filter:brightness(1.1);transform:translateY(-1px)}
.btn svg{width:1.1em;height:1.1em;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.btn-go{background:linear-gradient(135deg,#FFB766,var(--titan) 45%,#D9782A);color:#20110A;box-shadow:0 0 0 1px rgba(255,200,140,.5),0 10px 34px -8px rgba(232,166,79,.7)}
.btn-line{background:var(--hudbg);border:1px solid var(--hud2);color:var(--hud)}
.btn[disabled]{opacity:.35;pointer-events:none;filter:grayscale(.6)}
.route{display:flex;align-items:center;gap:calc(var(--u)*.28)}
.route i{width:calc(var(--u)*1);height:calc(var(--u)*.5);border-radius:2px;background:rgba(111,227,236,.15);transform:skewX(-20deg)}
.route i.done{background:var(--hud2)}
.route i.cur{background:var(--titan);box-shadow:0 0 10px var(--titan)}
.route span{font-size:calc(var(--u)*1.05);color:var(--muted);margin-inline-start:calc(var(--u)*.8);letter-spacing:.06em}
.route span b{color:var(--txt)}

/* planets */

.pl-moon{background:radial-gradient(circle at 35% 30%,#f2f2f2,#a9adb6 55%,#5d626c);box-shadow:inset -6px -5px 14px rgba(0,0,0,.45)}

.pl-titan{background-size:128%;background-position:center;background-repeat:no-repeat;box-shadow:0 0 calc(var(--u)*6) calc(var(--u)*1.2) rgba(232,166,79,.45),inset -20px -14px 50px rgba(0,0,0,.45)}
.saturn svg{width:100%;height:100%;overflow:visible}
.wp-label{position:absolute;font-size:calc(var(--u)*1.2);font-weight:700;color:rgba(214,230,255,.8);letter-spacing:.06em;white-space:nowrap;transform:translateX(50%)}
.wp-label small{display:block;font-size:.82em;font-weight:500;opacity:.7;letter-spacing:0;text-align:center}

/* ship */
.ship{position:relative;display:block}
.ship svg{width:100%;height:100%;display:block;overflow:visible}
.flame{position:absolute;top:50%;left:92%;height:46%;width:var(--fl,0px);transform-origin:left center;translate:0 -50%;border-radius:0 50% 50% 0/0 50% 50% 0;background:linear-gradient(90deg,#fff 0%,#FFE27A 18%,#FF9A2E 45%,rgba(234,101,10,.0) 100%);filter:blur(.6px);opacity:0;transition:opacity .3s,width .4s;animation:flick .12s infinite}
.flame.on{opacity:1}
.flame.turbo{background:linear-gradient(90deg,#fff 0%,#A7F6FF 18%,#6FE3EC 45%,rgba(79,163,220,0) 100%)}

/* lobby */
.lob{flex:1;display:grid;grid-template-columns:1fr calc(var(--u)*30);gap:calc(var(--u)*2);margin-top:calc(var(--u)*1);min-height:0}
.lob-main{display:flex;flex-direction:column;min-height:0}
.kicker{font-size:calc(var(--u)*1.15);font-weight:700;letter-spacing:.14em;color:var(--hud)}
.title-xl{font-size:calc(var(--u)*5.4);font-weight:900;line-height:1.02;margin:calc(var(--u)*.4) 0 calc(var(--u)*.6);background:linear-gradient(180deg,#fff 20%,#FFD9A0 70%,#E8A64F);-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{font-size:calc(var(--u)*1.5);color:var(--muted);line-height:1.5;max-width:calc(var(--u)*60)}
.rules{display:flex;gap:calc(var(--u)*1);margin:calc(var(--u)*1.4) 0}
.rule{display:flex;align-items:center;gap:calc(var(--u)*.8);padding:calc(var(--u)*.7) calc(var(--u)*1.2);font-size:calc(var(--u)*1.2);font-weight:500}
.rule svg{width:calc(var(--u)*2.2);height:calc(var(--u)*2.2);flex:0 0 auto}
.rule b{color:var(--titan)}
.pad{flex:1;min-height:0;display:flex;flex-direction:column;padding:calc(var(--u)*1.2) calc(var(--u)*1.6)}
.pad-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:calc(var(--u)*.8)}

.cnt{min-width:calc(var(--u)*3);height:calc(var(--u)*2.8);padding:0 calc(var(--u)*.8);border-radius:calc(var(--u)*.5);border:1px solid var(--hud2);color:var(--hud);display:inline-grid;place-items:center;font-weight:900;font-size:calc(var(--u)*1.5)}
.hangar{flex:1;position:relative;display:grid;grid-template-columns:repeat(auto-fill,minmax(calc(var(--u)*10.5),1fr));grid-auto-rows:min-content;gap:calc(var(--u)*.8) calc(var(--u)*.8);align-content:start;overflow:hidden;padding-bottom:calc(var(--u)*2)}
.hangar:after{content:"";position:absolute;left:-10%;right:-10%;bottom:calc(var(--u)*-50);height:calc(var(--u)*52);border-radius:50%;background:radial-gradient(circle at 50% 0%,rgba(79,163,220,.35),rgba(26,79,156,.25) 30%,transparent 60%);border-top:1px solid rgba(111,227,236,.35);pointer-events:none;z-index:0}
.bay{position:relative;z-index:1;display:flex;align-items:center;gap:calc(var(--u)*.7);padding:calc(var(--u)*.5) calc(var(--u)*.7);border-radius:calc(var(--u)*.6);background:rgba(255,255,255,.045);border:1px solid rgba(111,227,236,.16);animation:pop .5s cubic-bezier(.2,.8,.2,1) both;cursor:pointer;min-width:0}
.bay .ship{width:calc(var(--u)*4.2);height:calc(var(--u)*2.1);flex:0 0 auto}

.empty{color:var(--muted);font-size:calc(var(--u)*1.35);display:flex;align-items:center;gap:calc(var(--u)*.8);grid-column:1/-1;justify-self:center;margin-top:calc(var(--u)*4)}
.spinner{border-radius:50%;border:3px solid rgba(111,227,236,.2);border-top-color:var(--hud);animation:spin 1s linear infinite}

.brief{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:calc(var(--u)*1);padding:calc(var(--u)*1.8)}
.qrbox{background:#fff;border-radius:calc(var(--u)*.8);padding:calc(var(--u)*.9);box-shadow:0 0 0 calc(var(--u)*.4) rgba(111,227,236,.18),0 0 40px rgba(111,227,236,.25)}
.qrbox img{display:block;width:calc(var(--u)*18);height:calc(var(--u)*18);image-rendering:pixelated}
.pin{font-size:calc(var(--u)*5.2);font-weight:900;letter-spacing:.08em;line-height:1;direction:ltr;color:#fff;text-shadow:0 0 24px rgba(111,227,236,.45)}

.warn{font-size:calc(var(--u)*1.05);color:#FFD27A;background:rgba(249,200,14,.1);border:1px solid rgba(249,200,14,.35);padding:calc(var(--u)*.6) calc(var(--u)*1);border-radius:calc(var(--u)*.6);text-align:center;line-height:1.4}

/* countdown */
.cd{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:calc(var(--u)*1.2);position:relative}

.cd .fleet{display:flex;flex-wrap:wrap;justify-content:center;gap:calc(var(--u)*1.4);max-width:calc(var(--u)*80);margin-top:calc(var(--u)*2)}
.cd .fleet .ship{width:calc(var(--u)*5);height:calc(var(--u)*2.5);animation:shake .1s infinite}
.cd .fleet.launch .ship{transition:transform 1.4s cubic-bezier(.6,0,.9,.5);transform:translateX(-120vw)!important;animation:none}

/* ready */
.ready{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:calc(var(--u)*1.8)}
.sig{display:flex;align-items:flex-end;gap:calc(var(--u)*.5);height:calc(var(--u)*4)}
.sig i{width:calc(var(--u)*.8);background:var(--hud);border-radius:2px;box-shadow:0 0 10px var(--hud);animation:blink 1s infinite}
.sig i:nth-child(1){height:25%}.sig i:nth-child(2){height:50%;animation-delay:.15s}.sig i:nth-child(3){height:75%;animation-delay:.3s}.sig i:nth-child(4){height:100%;animation-delay:.45s}
.ready .qnum{font-size:calc(var(--u)*1.7);font-weight:700;color:var(--hud);letter-spacing:.2em}
.ready .qtext{font-size:calc(var(--u)*4);font-weight:800;line-height:1.2;max-width:calc(var(--u)*80)}
.ready .bar{width:calc(var(--u)*40);height:calc(var(--u)*.5);background:rgba(111,227,236,.15);overflow:hidden;border-radius:2px}
.ready .bar i{display:block;height:100%;background:var(--hud);box-shadow:0 0 10px var(--hud);transform-origin:right;animation:shrink 3.4s linear forwards}
@keyframes shrink{from{transform:scaleX(1)}to{transform:scaleX(0)}}

/* console (question + reveal) */
.console{flex:1;display:grid;grid-template-columns:1fr calc(var(--u)*30);gap:calc(var(--u)*1.6);margin-top:calc(var(--u)*1);min-height:0}
.cmain{display:flex;flex-direction:column;padding:calc(var(--u)*1.8) calc(var(--u)*2.2);min-height:0}
.cq{font-size:calc(var(--u)*3);font-weight:800;line-height:1.28;margin:calc(var(--u)*1) 0 calc(var(--u)*1.6);min-height:calc(var(--u)*8);display:flex;align-items:center}
.opts{display:flex;flex-direction:column;gap:calc(var(--u)*1);flex:1;justify-content:flex-end}
.opt{position:relative;display:flex;align-items:center;gap:calc(var(--u)*1.4);min-height:calc(var(--u)*7);padding:calc(var(--u)*.8) calc(var(--u)*1.4);border:1px solid var(--hudline);border-radius:calc(var(--u)*.6);background:linear-gradient(90deg,rgba(111,227,236,.03),rgba(111,227,236,.08));font-size:calc(var(--u)*2.1);font-weight:600;line-height:1.3;overflow:hidden;animation:rise .5s cubic-bezier(.2,.8,.2,1) both;transition:opacity .5s,border-color .5s,background .5s}
.opt .code{flex:0 0 auto;width:calc(var(--u)*4.6);height:calc(var(--u)*4.6);display:grid;place-items:center;border:1.5px solid var(--hud);border-radius:calc(var(--u)*.5);color:var(--hud);font-weight:800;font-size:calc(var(--u)*1.9);direction:ltr;letter-spacing:.04em;background:rgba(111,227,236,.06)}

.opt .fill{position:absolute;inset:0 0 0 auto;width:0;background:linear-gradient(270deg,rgba(124,227,139,.0),rgba(124,227,139,.0));transition:width 1.1s cubic-bezier(.2,.8,.2,1);z-index:0}
.opt .meta{position:relative;z-index:1;font-size:calc(var(--u)*1.35);font-weight:700;color:var(--muted);white-space:nowrap;display:flex;align-items:center;gap:calc(var(--u)*.5)}
.opt.right{border-color:var(--ok);background:linear-gradient(90deg,rgba(124,227,139,.08),rgba(124,227,139,.22));box-shadow:0 0 0 1px var(--ok),0 0 30px rgba(124,227,139,.25)}

.opt .fill.show{background:linear-gradient(270deg,rgba(111,227,236,.22),rgba(111,227,236,.05))}

.cside{display:flex;flex-direction:column;gap:calc(var(--u)*1.6);min-height:0}

.dial{position:relative;width:calc(var(--u)*17);height:calc(var(--u)*17)}

.dial.low .rd b{color:var(--bad);animation:blink .5s infinite}
.signals{flex:1;padding:calc(var(--u)*1.4);display:flex;flex-direction:column;min-height:0}
.signals .top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:calc(var(--u)*1)}
.signals .top b{font-size:calc(var(--u)*3.2);font-weight:900;direction:ltr}

.sgrid{display:flex;flex-wrap:wrap;gap:calc(var(--u)*.7);align-content:flex-start}
.sgrid .ship{width:calc(var(--u)*3.6);height:calc(var(--u)*1.8);opacity:.22;filter:grayscale(1);transition:.4s}
.sgrid .ship.lit{opacity:1;filter:none;drop-shadow:0 0 6px}
.log{padding:calc(var(--u)*1.6) calc(var(--u)*1.8);flex:1;display:flex;flex-direction:column;gap:calc(var(--u)*1);animation:rise .6s .3s both}
.log p{font-size:calc(var(--u)*1.55);line-height:1.55}
.log .stat{margin-top:auto;padding-top:calc(var(--u)*1);border-top:1px solid var(--hudline);font-size:calc(var(--u)*1.2);color:var(--muted);display:flex;justify-content:space-between}

/* race map */
.map{position:relative;flex:1;margin-top:calc(var(--u)*.8);min-height:0;--R:calc(var(--u)*24);--L:calc(var(--u)*9);overflow:hidden;border-radius:calc(var(--u)*1)}

.map .belt{position:absolute;top:calc(var(--u)*3);bottom:calc(var(--u)*4);background-image:radial-gradient(circle,rgba(200,180,160,.35) 1px,transparent 1.6px),radial-gradient(circle,rgba(200,180,160,.22) 1.4px,transparent 2px);background-size:14px 17px,23px 29px;background-position:0 0,7px 9px;opacity:.8;border-left:1px solid rgba(200,180,160,.12);border-right:1px solid rgba(200,180,160,.12)}

.lane.r1 .rk{background:var(--titan);color:#20110A}.lane.r2 .rk{background:#C9D3E6;color:#141b30}.lane.r3 .rk{background:#C98A57;color:#20110A}
.lane .sw{width:calc(var(--fs)*.7);height:calc(var(--fs)*.7);border-radius:2px;flex:0 0 auto;background:var(--sc)}

.legend{position:absolute;bottom:0;right:0;left:0;height:calc(var(--u)*3.6);display:flex;align-items:center;gap:calc(var(--u)*1.6);padding:0 calc(var(--u)*1.4);font-size:calc(var(--u)*1.15);color:var(--muted)}
.legend .ev{flex:1;display:flex;gap:calc(var(--u)*2.2);overflow:hidden;white-space:nowrap}

/* landing */
.landing{flex:1;position:relative;min-height:0;overflow:hidden;margin:0 calc(var(--u)*-2.2) calc(var(--u)*-1.4)}

.ccard.c1{width:calc(var(--u)*27);border-color:rgba(232,166,79,.6);box-shadow:0 0 50px rgba(232,166,79,.25)}

.toast{position:fixed;bottom:calc(var(--u)*2);left:50%;transform:translateX(-50%);z-index:60;padding:calc(var(--u)*.8) calc(var(--u)*1.6);border-radius:calc(var(--u)*.6);font-size:calc(var(--u)*1.2);background:rgba(10,26,48,.95);border:1px solid var(--hudline)}

/* ================= PLAYER (cockpit) ================= */
.ply{height:100%;height:100dvh;display:flex;flex-direction:column;padding:max(12px,env(safe-area-inset-top)) 14px max(14px,env(safe-area-inset-bottom))}
.ptop{display:flex;align-items:center;justify-content:space-between;height:42px;flex:0 0 auto;gap:8px}
.ptop .logo{height:28px}
.me{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;padding:5px 10px;border-radius:8px;border:1px solid var(--hudline);background:var(--hudbg);min-width:0}
.me .ship{width:30px;height:15px;flex:0 0 auto}
.me span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:120px}
.me b{color:var(--hud);direction:ltr}
.pbody{flex:1;display:flex;flex-direction:column;min-height:0}
.center{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:14px}
.ph1{font-size:28px;font-weight:900;line-height:1.2}
.pp{font-size:15px;color:var(--muted);line-height:1.5;max-width:320px}
.ptag{font-size:12px;letter-spacing:.16em;color:var(--hud);font-weight:700;display:inline-flex;align-items:center;gap:6px}
.ptag i{width:7px;height:7px;border-radius:50%;background:var(--hud);box-shadow:0 0 8px var(--hud);animation:blink 1.4s infinite}
.jhero{display:flex;flex-direction:column;align-items:center;gap:6px;margin:6px 0 12px}
.jhero .scene{position:relative;width:100%;height:96px}
.jhero .scene .pl-titan{width:84px;height:84px;left:14px;top:6px}
.jhero .scene .pl-earth{width:44px;height:44px;right:18px;top:30px}
.jhero .scene .path{position:absolute;left:100px;right:66px;top:52px;border-top:2px dashed rgba(111,227,236,.35)}
.jhero .scene .ship{position:absolute;width:48px;height:24px;right:46%;top:40px;animation:floaty 3s ease-in-out infinite}
.jhero h1{font-size:30px;font-weight:900;background:linear-gradient(180deg,#fff,#FFD9A0 70%,var(--titan));-webkit-background-clip:text;background-clip:text;color:transparent}
.jhero p{font-size:14px;color:var(--muted)}
.form{display:flex;flex-direction:column;gap:10px;width:100%;max-width:440px;margin:0 auto}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:12px;color:var(--hud);font-weight:700;letter-spacing:.12em;padding-inline-start:2px}
.inp{width:100%;height:56px;border-radius:10px;border:1px solid var(--hud2);background:rgba(10,26,48,.7);color:#fff;font-size:21px;font-weight:700;padding:0 16px;outline:none;text-align:center;transition:.2s}
.inp:focus{border-color:var(--hud);box-shadow:0 0 0 3px rgba(111,227,236,.2)}
.inp::placeholder{color:rgba(255,255,255,.3);font-weight:500}
.inp.pin{letter-spacing:.2em;direction:ltr}
.pinchip{align-self:center;display:inline-flex;gap:8px;align-items:center;font-size:13px;color:var(--muted);padding:6px 14px;border-radius:8px;border:1px solid var(--hudline);background:var(--hudbg)}
.pinchip b{color:#fff;font-size:17px;letter-spacing:.14em;direction:ltr}
.picker{display:flex;flex-direction:column;gap:8px;padding:10px;border-radius:12px}
.hulls{display:flex;gap:8px}
.hull{flex:1;height:56px;border-radius:10px;border:1px solid rgba(111,227,236,.2);background:rgba(255,255,255,.03);display:grid;place-items:center}
.hull .ship{width:64px;height:32px}
.hull.sel{border-color:var(--hud);background:rgba(111,227,236,.12);box-shadow:0 0 0 2px rgba(111,227,236,.25)}
.colors{display:flex;gap:8px;justify-content:space-between}
.col{width:34px;height:34px;border-radius:50%;background:var(--c);border:3px solid transparent;box-shadow:0 0 0 1px rgba(255,255,255,.15)}
.col.sel{border-color:#fff;box-shadow:0 0 0 2px var(--c),0 0 14px var(--c)}
.pbtn{height:58px;border-radius:12px;font-size:20px;font-weight:800;background:linear-gradient(135deg,#FFB766,var(--titan) 45%,#D9782A);color:#20110A;box-shadow:0 10px 30px -8px rgba(232,166,79,.7);display:flex;align-items:center;justify-content:center;gap:8px}
.pbtn:active{transform:scale(.98)}
.pbtn[disabled]{opacity:.5}
.err{color:#FF9AB0;font-size:14px;min-height:18px;text-align:center;font-weight:500}
.pfoot{text-align:center;font-size:11px;color:rgba(255,255,255,.32);padding-top:6px}
.bigship{width:150px;height:75px}

.dots3 i:nth-child(2){animation-delay:.2s}.dots3 i:nth-child(3){animation-delay:.4s}
.pcd{font-size:120px;font-weight:900;line-height:1;direction:ltr;background:linear-gradient(180deg,#fff,#FFD9A0 60%,var(--titan));-webkit-background-clip:text;background-clip:text;color:transparent}
/* cockpit question */
.cock{display:flex;flex-direction:column;gap:10px;flex:1;min-height:0}

.cock .q p{font-size:17px;font-weight:700;line-height:1.38}
.fuel{height:6px;border-radius:2px;background:rgba(111,227,236,.15);overflow:hidden;margin-top:10px}
.fuel i{display:block;height:100%;background:var(--hud);box-shadow:0 0 8px var(--hud);transform-origin:right}
.fuel.low i{background:var(--bad);box-shadow:0 0 8px var(--bad)}
.keys{flex:1;display:flex;flex-direction:column;gap:9px;min-height:0}

.key:nth-child(2){animation-delay:.05s}.key:nth-child(3){animation-delay:.1s}.key:nth-child(4){animation-delay:.15s}

.locked{width:120px;height:120px;border-radius:16px;border:2px solid var(--hud);display:grid;place-items:center;font-size:44px;font-weight:900;color:var(--hud);direction:ltr;box-shadow:0 0 30px rgba(111,227,236,.35),inset 0 0 20px rgba(111,227,236,.2);animation:pop .5s both}

  dock(){tone(520,.08,'sine',.12);tone(780,.12,'sine',.1,.07);},
  blip(){tone(1046,.05,'square',.04);},
  tick(hi){tone(hi?1320:990,.05,'square',.05);},
  lock(){tone(660,.06,'triangle',.1);tone(990,.06,'triangle',.08,.05);},
  count(i){tone(i===0?880:440,i===0?.6:.16,'sine',.2);},
  launch(){noise(2.6,.35,900,60);tone(70,2.2,'sawtooth',.06,0,40);},
  incoming(){[0,.12,.24].forEach(w=>tone(1400,.05,'sine',.06,w));},
  confirm(){[392,523,659].forEach((f,i)=>tone(f,.4,'triangle',.12,i*.07));},
  timeup(){tone(300,.35,'sawtooth',.06,0,150);},
  engines(){noise(2.8,.22,1400,200);tone(110,2.6,'sawtooth',.03,0,220);},
  land(){noise(1.2,.15,600,80);tone(196,.5,'sine',.1,.6);},
  anthem(){[[392,0],[523,.2],[659,.4],[784,.6],[659,.85],[784,1.05],[1046,1.3]].forEach(([f,w])=>{tone(f,.5,'triangle',.12,w);tone(f/2,.5,'sine',.07,w);});},
  startLoop(){api.stopLoop();if(!ctx())return;let s=0;const N=[146.8,0,174.6,0,220,0,174.6,196];loop=setInterval(()=>{if(muted){s++;return;}const f=N[s%8];if(f)tone(f,.25,'sine',.06);if(s%8===0)tone(73.4,.6,'triangle',.06);if(s%2===1)tone(2400,.02,'square',.012);s++;},240);},
  stopLoop(){if(loop){clearInterval(loop);loop=null;}}};return api;})();

const params=new URLSearchParams(location.search);
const IS_PLAYER=params.has('join')||params.has('play');
document.addEventListener('pointerdown',()=>Sound.unlock());
function peerOpts(){return {debug:1,config:{iceServers:[{urls:'stun:stun.l.google.com:19302'},{urls:'stun:global.stun.twilio.com:3478'},{urls:['turn:eu-0.turn.peerjs.com:3478','turn:us-0.turn.peerjs.com:3478'],username:'peerjs',credential:'peerjsp'}]}};}
const pct = d => Math.round(100*d/JOURNEY);

/* ============================== מורה / בקרת משימה ============================== */
function Host(){
 const N=QUESTIONS.length;
 const H={pin:null,peer:null,players:new Map(),phase:'boot',qi:-1,qStart:0,qEnd:0,raf:0,timer:null,net:'connecting',restored:false,order:[],landSeq:0,events:[]};
 window.__host=H;
 const app=$('#app'); const SAVE_KEY='tr-host-state';
 const plist=()=>[...H.players.values()];
 function save(){try{localStorage.setItem(SAVE_KEY,JSON.stringify({ts:Date.now(),pin:H.pin,qi:H.qi,phase:H.phase,order:H.order,landSeq:H.landSeq,events:H.events,
  players:plist().map(p=>({cid:p.cid,name:p.name,ship:p.ship,dist:p.dist,prevDist:p.prevDist,streak:p.streak,gain:p.gain,kind:p.kind,turbo:p.turbo,landed:p.landed,landQ:p.landQ,landOrder:p.landOrder,answers:p.answers,lastResult:p.lastResult,prevRank:p.prevRank,rank:p.rank,prevLanded:p.prevLanded,prevLandOrder:p.prevLandOrder}))}));}catch(e){}}
 function load(){try{const s=JSON.parse(localStorage.getItem(SAVE_KEY)||'null');if(s&&Date.now()-s.ts<3*3600e3&&s.phase!=='end')return s;}catch(e){}return null;}
 function clearSave(){localStorage.removeItem(SAVE_KEY);}
 function joinURL(){let base=PUBLIC_URL&&!PUBLIC_URL.startsWith('__')?PUBLIC_URL:(location.origin+location.pathname);if(base.startsWith('file:'))base=location.href.split('?')[0];return base+(base.includes('?')?'&':'?')+'join='+H.pin;}
 const isLocalFile=()=>location.protocol==='file:'&&!(PUBLIC_URL&&!PUBLIC_URL.startsWith('__'));

 /* ---------- רשת ---------- */
 const newPin=()=>String(100000+Math.floor(Math.random()*900000));
 function openPeer(pin,attempt=0){
  H.pin=pin;H.net='connecting';updateStatus();
  const peer=new Peer(ID_PREFIX+pin,peerOpts());H.peer=peer;
  peer.on('open',()=>{H.net='ok';updateStatus();if(H.phase==='boot'){H.phase='lobby';render();}});
  peer.on('connection',onConn);
  peer.on('disconnected',()=>{H.net='bad';updateStatus();setTimeout(()=>{if(!peer.destroyed&&peer.disconnected)try{peer.reconnect();}catch(e){}},1500);});
  peer.on('error',e=>{console.warn('host peer error',e.type);
   if(e.type==='unavailable-id'){peer.destroy();if(H.restored&&attempt<8)setTimeout(()=>openPeer(pin,attempt+1),2500);else{H.restored=false;openPeer(newPin());}return;}
   if(['network','server-error','socket-error','socket-closed'].includes(e.type)){H.net='bad';updateStatus();setTimeout(()=>{if(peer.destroyed)return;if(peer.disconnected)try{peer.reconnect();}catch(_){}},3000);}});
 }
 function onConn(conn){conn.on('data',m=>onMsg(conn,m));conn.on('close',()=>dropConn(conn));conn.on('error',()=>dropConn(conn));}
 function dropConn(conn){const p=conn._player;if(p&&p.conn===conn){p.connected=false;refreshPlayers();}}
 function send(p,m){if(p.conn&&p.conn.open){try{p.conn.send(m);}catch(e){}}}
 function broadcast(fn){for(const p of H.players.values())if(p.connected)send(p,typeof fn==='function'?fn(p):fn);}
 function uniqueName(raw,cid){let base=String(raw||'').replace(/[\u0000-\u001f<>]/g,'').replace(/\s+/g,' ').trim().slice(0,16);if(!base)return null;
  const taken=n=>plist().some(p=>p.cid!==cid&&p.name.toLowerCase()===n.toLowerCase());let name=base,k=2;while(taken(name))name=base.slice(0,13)+' '+(k++);return name;}
 function cleanShip(s){const h=Math.max(0,Math.min(2,(s&&s.h)|0)),c=Math.max(0,Math.min(SHIPC.length-1,(s&&s.c)|0));return {h,c};}
 function onMsg(conn,m){
  if(!m||typeof m!=='object')return;
  if(m.t==='ping'){try{conn.send({t:'pong'});}catch(e){}const p=conn._player;if(p){p.seen=Date.now();if(!p.connected&&p.conn===conn){p.connected=true;refreshPlayers();}}return;}
  if(m.t==='join'){
   const cid=String(m.cid||'').slice(0,40);if(!cid)return;
   let p=H.players.get(cid);
   if(p){if(p.conn&&p.conn!==conn)try{p.conn.close();}catch(e){}p.conn=conn;p.connected=true;p.seen=Date.now();conn._player=p;}
   else{const name=uniqueName(m.name,cid);if(!name){conn.send({t:'error',msg:'יש להקליד שם'});return;}
    p={cid,name,ship:cleanShip(m.ship),dist:0,prevDist:0,streak:0,gain:0,kind:'',turbo:0,landed:false,landQ:-1,landOrder:0,answers:{},conn,connected:true,seen:Date.now(),lastResult:null,prevRank:0,rank:0};
    conn._player=p;H.players.set(cid,p);if(!H.order.includes(cid))H.order.push(cid);Sound.dock();}
   send(p,{t:'welcome',name:p.name,ship:p.ship,dist:p.dist});syncPlayer(p);refreshPlayers();save();return;
  }
  const p=conn._player;if(!p)return;p.seen=Date.now();
  if(m.t==='answer'){
   if(H.phase!=='question'||m.qi!==H.qi||p.answers[H.qi])return;
   const a=m.a|0;if(a<0||a>3)return;
   const tms=Math.max(0,Math.min(Date.now()-H.qStart,QUESTIONS[H.qi].t*1000));
   p.answers[H.qi]={a,t:tms};send(p,{t:'ack',qi:H.qi,a});Sound.lock();updateAnswered();save();
   const live=plist().filter(x=>x.connected);
   if(live.length&&live.every(x=>x.answers[H.qi])){clearTimeout(H.timer);H.timer=setTimeout(endQuestion,700);}
  }
 }
 const qPayload=()=>{const Q=QUESTIONS[H.qi];return {t:'question',qi:H.qi,total:N,q:Q.q,o:Q.o,endsIn:Math.max(0,H.qEnd-Date.now()),dur:Q.t*1000};};
 function syncPlayer(p){
  switch(H.phase){
   case 'lobby':send(p,{t:'lobby'});break;
   case 'countdown':send(p,{t:'countdown',endsIn:Math.max(0,H.cdEnd-Date.now())});break;
   case 'ready':send(p,{t:'ready',qi:H.qi,total:N});break;
   case 'question':{const pl=qPayload();const a=p.answers[H.qi];if(a)pl.answered=a.a;send(p,pl);break;}
   case 'reveal':case 'race':send(p,p.lastResult||{t:'wait',dist:p.dist});break;
   case 'end':send(p,finalFor(p));break;
  }
 }
 setInterval(()=>{const now=Date.now();let ch=false;for(const p of H.players.values()){if(p.connected&&now-p.seen>14000){p.connected=false;ch=true;}}if(ch)refreshPlayers();},3000);

 /* ---------- מכניקת המרוץ ---------- */
 function ranking(prev){ // prev=true: המצב לפני השאלה האחרונה
  const key=p=>prev?{l:p.prevLanded,o:p.prevLandOrder,d:p.prevDist}:{l:p.landed,o:p.landOrder,d:p.dist};
  return plist().sort((a,b)=>{const A=key(a),B=key(b);if(A.l!==B.l)return A.l?-1:1;if(A.l&&B.l)return A.o-B.o;return (B.d-A.d)||a.name.localeCompare(b.name,'he');});
 }
 function startCountdown(){
  if(H.players.size===0)return;
  for(const p of H.players.values()){Object.assign(p,{dist:0,prevDist:0,streak:0,gain:0,kind:'',turbo:0,landed:false,landQ:-1,landOrder:0,answers:{},lastResult:null,prevRank:0,rank:0});}
  H.qi=-1;H.landSeq=0;H.events=[];H.order=ranking().map(p=>p.cid);
  H.phase='countdown';H.cdEnd=Date.now()+COUNT_MS;save();render();
  broadcast({t:'countdown',endsIn:COUNT_MS});
  H.timer=setTimeout(()=>{ $('.fleet')?.classList.add('launch'); Sound.launch(); warp(1600); setTimeout(nextQuestion,1500); },COUNT_MS);
 }
 function nextQuestion(){
  clearTimeout(H.timer);H.qi++;if(H.qi>=N)return showLanding();
  H.phase='ready';save();render();Sound.stopLoop();Sound.incoming();
  broadcast({t:'ready',qi:H.qi,total:N});
  H.timer=setTimeout(startQuestion,READY_MS);
 }
 function startQuestion(){
  clearTimeout(H.timer);const Q=QUESTIONS[H.qi];H.phase='question';H.qStart=Date.now();H.qEnd=H.qStart+Q.t*1000;save();
  render();broadcast(qPayload());Sound.startLoop();
  H.timer=setTimeout(endQuestion,Q.t*1000+150);
 }
 function endQuestion(){
  if(H.phase!=='question')return;
  clearTimeout(H.timer);cancelAnimationFrame(H.raf);Sound.stopLoop();
  const Q=QUESTIONS[H.qi],dur=Q.t*1000;
  ranking().forEach((p,i)=>p.prevRank=i+1);
  const newly=[];
  for(const p of H.players.values()){
   p.prevDist=p.dist;p.prevLanded=p.landed;p.prevLandOrder=p.landOrder;
   const a=p.answers[H.qi];let gain=0,kind,turbo=0;
   if(a&&a.a===Q.c){p.streak++;kind='boost';if(!p.landed){const speed=1-a.t/dur;gain=Math.round(BOOST_MIN+BOOST_SPEED*speed);turbo=turboFor(p.streak);gain+=turbo;if(turbo)kind='turbo';}}
   else if(a){p.streak=0;kind='stall';if(!p.landed)gain=DRIFT;}
   else{p.streak=0;kind='off';}
   if(p.landed)gain=0;
   p.gain=gain;p.turbo=turbo;p.kind=kind;p.dist=Math.min(JOURNEY,p.dist+gain);
   if(!p.landed&&p.dist>=JOURNEY){p.landed=true;p.landQ=H.qi;newly.push(p);}
  }
  newly.sort((x,y)=>x.answers[H.qi].t-y.answers[H.qi].t).forEach(p=>p.landOrder=++H.landSeq);
  const after=ranking();after.forEach((p,i)=>p.rank=i+1);
  // יומן אירועים לשורת הסטטוס
  const ev=[];const top=plist().filter(p=>p.gain>0).sort((a,b)=>b.gain-a.gain)[0];
  newly.forEach(p=>ev.push(`<b>${esc(p.name)}</b> נחת/ה על טיטאן!`));
  if(top)ev.push(`הבוסט הגדול: <b>${esc(top.name)}</b> <bdi class="n">+${top.gain}</bdi>`);
  const tb=plist().filter(p=>p.kind==='turbo').length;if(tb)ev.push(`<b>${tb}</b> ${tb===1?'ספינה בטורבו':'ספינות בטורבו'}`);
  const st=plist().filter(p=>p.kind==='stall'||p.kind==='off').length;if(st)ev.push(`<b>${st}</b> ${st===1?'תקלת מנוע':'תקלות מנוע'}`);
  const lead=after[0];if(lead&&!newly.length)ev.push(`בראש המרוץ: <b>${esc(lead.name)}</b> · <bdi class="n">${pct(lead.dist)}%</bdi>`);

function Player(){

 function cleanup(){const c=P.conn,pe=P.peer;P.conn=null;P.peer=null;try{c&&c.close();}catch(e){}try{pe&&pe.destroy();}catch(e){}}

 function sLobby(){screen(`<div class="center"><div class="ptag"><i></i>עגינה הושלמה</div><div class="bigship a-pop">${ship(P.ship)}</div><div class="ph1 a-rise">${esc(P.name)}, הספינה שלך על כן השיגור</div>
