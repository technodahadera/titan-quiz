<style>:root{
  --bg0:#060918;--bg1:#0b1230;
  --pink:#E3195C;--blue:#4FA3DC;--orange:#EA650A;--green:#86C13C;--yellow:#F9C80E;--purple:#7A62AA;--teal:#52B3BA;
  --titan:#E2A556;
  --txt:#F4F6FF;--muted:rgba(226,232,255,.62);
  --glass:rgba(255,255,255,.055);--line:rgba(255,255,255,.12);
  --u:min(1vw,1.7778vh);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg0);color:var(--txt);font-family:'Rubik',system-ui,sans-serif;overflow:hidden}
body{background:
  radial-gradient(60% 55% at 12% 88%,rgba(226,165,86,.20),transparent 70%),
  radial-gradient(50% 50% at 92% 8%,rgba(122,98,170,.28),transparent 70%),
  radial-gradient(45% 40% at 70% 70%,rgba(79,163,220,.12),transparent 70%),
  linear-gradient(180deg,var(--bg1),var(--bg0));}
#stars{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
#confetti{position:fixed;inset:0;width:100%;height:100%;z-index:50;pointer-events:none}
#app{position:relative;z-index:1;height:100%}
button{font-family:inherit;cursor:pointer;border:0;color:inherit}
input{font-family:inherit}
.hidden{display:none!important}
.glass{background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.shape{display:block}
.shape svg{width:100%;height:100%;display:block}
.c0{--c:var(--pink);--c2:#B8104A}.c1{--c:var(--blue);--c2:#2D78B8}.c2{--c:var(--orange);--c2:#C24D00}.c3{--c:var(--green);--c2:#5C9622}
@keyframes rise{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
@keyframes pop{0%{opacity:0;transform:scale(.4)}70%{transform:scale(1.08)}100%{opacity:1;transform:scale(1)}}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.06);opacity:.85}}
@keyframes glow{0%,100%{box-shadow:0 0 0 0 rgba(249,200,14,.0)}50%{box-shadow:0 0 40px 6px rgba(249,200,14,.35)}}
@keyframes shimmer{to{background-position:200% 0}}
.anim-rise{animation:rise .6s cubic-bezier(.2,.8,.2,1) both}
.anim-pop{animation:pop .5s cubic-bezier(.2,.8,.2,1) both}

/* ================= HOST ================= */
.host{height:100%;display:flex;flex-direction:column;padding:calc(var(--u)*1.6) calc(var(--u)*2.6) calc(var(--u)*1.8)}
.hdr{display:flex;align-items:center;justify-content:space-between;height:calc(var(--u)*5.2);flex:0 0 auto;gap:calc(var(--u)*1.5)}
.hdr .logo{height:calc(var(--u)*4.4)}
.hdr .mid{flex:1;display:flex;justify-content:center}
.hdr .ctrls{display:flex;align-items:center;gap:calc(var(--u)*.8)}
.pill{display:inline-flex;align-items:center;gap:calc(var(--u)*.7);padding:calc(var(--u)*.6) calc(var(--u)*1.5);border-radius:999px;font-size:calc(var(--u)*1.25);font-weight:600;color:var(--muted)}
.pill b{color:var(--txt);font-weight:800}
.ibtn{width:calc(var(--u)*3.4);height:calc(var(--u)*3.4);border-radius:50%;display:grid;place-items:center;background:var(--glass);border:1px solid var(--line);transition:.2s}
.ibtn:hover{background:rgba(255,255,255,.14)}
.ibtn svg{width:46%;height:46%;fill:none;stroke:#fff;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.btn{font-weight:800;font-size:calc(var(--u)*1.45);padding:calc(var(--u)*.85) calc(var(--u)*2.2);border-radius:calc(var(--u)*1.2);display:inline-flex;align-items:center;gap:calc(var(--u)*.7);transition:transform .15s,filter .2s,opacity .2s}
.btn:hover{filter:brightness(1.08);transform:translateY(-2px)}
.btn:active{transform:translateY(1px)}
.btn svg{width:1.1em;height:1.1em;fill:currentColor}
.btn-primary{background:linear-gradient(135deg,#FBD54A,var(--yellow) 40%,#F0A20B);color:#1B1530;box-shadow:0 10px 30px -8px rgba(249,200,14,.55),inset 0 1px 0 rgba(255,255,255,.6)}
.btn-ghost{background:var(--glass);border:1px solid var(--line);color:var(--txt)}
.btn[disabled]{opacity:.35;pointer-events:none;filter:grayscale(.6)}
.progress-dots{display:flex;gap:calc(var(--u)*.45);align-items:center}
.progress-dots i{width:calc(var(--u)*1.6);height:calc(var(--u)*.45);border-radius:9px;background:rgba(255,255,255,.16)}
.progress-dots i.done{background:rgba(255,255,255,.55)}
.progress-dots i.cur{background:var(--yellow);width:calc(var(--u)*3)}

/* lobby */
.lobby{flex:1;display:grid;grid-template-columns:1.15fr .85fr;grid-template-rows:auto 1fr;gap:calc(var(--u)*1.6) calc(var(--u)*2.4);margin-top:calc(var(--u)*1.2);min-height:0}
.lobby-hero{position:relative;display:flex;flex-direction:column;justify-content:center;padding:calc(var(--u)*1) 0}
.kicker{display:inline-flex;align-items:center;gap:calc(var(--u)*.6);font-size:calc(var(--u)*1.2);font-weight:700;letter-spacing:.02em;color:var(--titan);text-transform:none}
.kicker:before{content:"";width:calc(var(--u)*2.4);height:3px;border-radius:3px;background:linear-gradient(90deg,var(--titan),transparent)}
.title-xl{font-size:calc(var(--u)*5.6);font-weight:900;line-height:1.02;margin:calc(var(--u)*.6) 0 calc(var(--u)*.8);letter-spacing:-.01em;
  background:linear-gradient(180deg,#fff 30%,#FFE2B0 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{font-size:calc(var(--u)*1.55);color:var(--muted);font-weight:400;line-height:1.5;max-width:calc(var(--u)*44)}
.steps{display:flex;gap:calc(var(--u)*1.2);margin-top:calc(var(--u)*2)}
.step{display:flex;align-items:center;gap:calc(var(--u)*.8);font-size:calc(var(--u)*1.3);font-weight:500;padding:calc(var(--u)*.8) calc(var(--u)*1.3);border-radius:calc(var(--u)*1)}
.step .n{width:calc(var(--u)*2.2);height:calc(var(--u)*2.2);border-radius:50%;display:grid;place-items:center;font-weight:800;background:var(--c);color:#fff;font-size:calc(var(--u)*1.1)}
.joincard{grid-row:1 / span 2;grid-column:2;border-radius:calc(var(--u)*2);padding:calc(var(--u)*2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:calc(var(--u)*1.2);position:relative;overflow:hidden}

.pq-head{display:flex;flex-direction:column;gap:8px;margin:6px 0 12px}
.pq-meta{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);font-weight:600}
.pq-text{font-size:17px;font-weight:700;line-height:1.35;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.tbar{height:6px;border-radius:6px;background:rgba(255,255,255,.12);overflow:hidden}
.tbar i{display:block;height:100%;background:linear-gradient(90deg,var(--yellow),var(--orange));transform-origin:right}
.ptiles{flex:1;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:12px;min-height:0}
.ptile{border-radius:20px;background:linear-gradient(160deg,var(--c),var(--c2));display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:12px;font-size:17px;font-weight:700;line-height:1.3;text-align:center;
  box-shadow:0 6px 0 rgba(0,0,0,.3),inset 0 1px 0 rgba(255,255,255,.35);text-shadow:0 1px 4px rgba(0,0,0,.25);transition:transform .12s,opacity .3s;animation:pop .4s cubic-bezier(.2,.8,.2,1) both}
.ptile:nth-child(2){animation-delay:.05s}.ptile:nth-child(3){animation-delay:.1s}.ptile:nth-child(4){animation-delay:.15s}
.ptile:active{transform:translateY(4px);box-shadow:0 2px 0 rgba(0,0,0,.3)}
.ptile .shape{width:48px;height:48px}
.chosen{width:120px;height:120px;border-radius:28px;background:linear-gradient(160deg,var(--c),var(--c2));display:grid;place-items:center;animation:pop .5s both;box-shadow:0 20px 50px -10px rgba(0,0,0,.5)}
.chosen .shape{width:60px;height:60px}
.fb{position:fixed;inset:0;z-index:5;display:flex;flex-direction:column;padding:max(14px,env(safe-area-inset-top)) 16px max(16px,env(safe-area-inset-bottom))}
.fb.ok{background:radial-gradient(80% 60% at 50% 35%,#7DCB3A,#3F8A1C 60%,#25570F)}
.fb.no{background:radial-gradient(80% 60% at 50% 35%,#F0306E,#A80F45 60%,#5E0828)}
.fb.none{background:radial-gradient(80% 60% at 50% 35%,#5E6A9A,#2E365E 60%,#171B36)}
.fb .center{gap:12px}
.fb .ring2{width:120px;height:120px;border-radius:50%;background:rgba(255,255,255,.18);display:grid;place-items:center;animation:pop .6s cubic-bezier(.2,.8,.2,1) both;box-shadow:0 0 0 12px rgba(255,255,255,.08)}
.fb .ring2 svg{width:56%;height:56%;fill:none;stroke:#fff;stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round}
.fb h2{font-size:40px;font-weight:900;animation:rise .5s .15s both}
.fb .pts{font-size:22px;font-weight:800;padding:10px 24px;border-radius:999px;background:rgba(0,0,0,.22);animation:rise .5s .25s both;font-variant-numeric:tabular-nums}
.fb .streakb{display:inline-flex;gap:6px;align-items:center;font-size:16px;font-weight:700;animation:rise .5s .3s both}
.fb .streakb svg{width:20px;height:20px;fill:#FFD34D}
.fb .correct{font-size:15px;background:rgba(0,0,0,.2);padding:10px 16px;border-radius:14px;max-width:330px;line-height:1.45;animation:rise .5s .3s both}
.fb .rankcard{margin-top:6px;background:rgba(0,0,0,.25);border-radius:18px;padding:14px 22px;min-width:240px;animation:rise .5s .4s both}
.fb .rankcard .r{font-size:30px;font-weight:900}
.fb .rankcard .s{font-size:14px;opacity:.85;margin-top:4px}
.final-medal{width:150px;height:150px;animation:pop .8s cubic-bezier(.2,.8,.2,1) both}
.banner{position:fixed;top:0;left:0;right:0;z-index:20;padding:calc(env(safe-area-inset-top) + 10px) 16px 10px;text-align:center;font-size:14px;font-weight:700;background:rgba(227,25,92,.92);display:flex;align-items:center;justify-content:center;gap:10px}
.banner .spinner{width:16px;height:16px;border-width:2px;border-top-color:#fff}

bdi.n{unicode-bidi:isolate;direction:ltr}

.chips.dense{gap:calc(var(--u)*.5)}
.chips.dense .chip{font-size:calc(var(--u)*1.1);padding:calc(var(--u)*.4) calc(var(--u)*.9) calc(var(--u)*.4) calc(var(--u)*.45)}
.chips.dense .chip .dot{width:calc(var(--u)*1.5);height:calc(var(--u)*1.5);font-size:calc(var(--u)*.8)}
.chips.denser .chip{font-size:calc(var(--u)*.95);padding:calc(var(--u)*.3) calc(var(--u)*.7)}
.chips.denser .chip .dot{display:none}

        var b0 = bin.read();

        var b2 = read();
        var b3 = read();
        var k = String.fromCharCode( (b0 << 8) | b1);
        var v = (b2 << 8) | b3;

      }

      var bytes = [];
      for (var i = 0; i < s.length; i += 1) {
        var c = s.charCodeAt(i);
        if (c < 128) {
          bytes.push(c);

 function tone(f,dur=.15,type='sine',vol=.25,when=0,slide=0){const a=ctx();if(!a)return;const t=a.currentTime+when;const o=a.createOscillator(),g=a.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(slide,t+dur);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+.012);g.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(g);g.connect(master);o.start(t);o.stop(t+dur+.05);}
 const api={
  unlock(){ctx();},
  get muted(){return muted;},
  toggle(){muted=!muted;localStorage.setItem('tq-muted',muted?'1':'0');if(master)master.gain.value=muted?0:.6;return muted;},
  join(){tone(660+Math.random()*300,.12,'sine',.18);tone(1320,.1,'sine',.06,.05);},
  tick(hi){tone(hi?1200:900,.06,'square',.06);},
  answer(){tone(520,.08,'triangle',.12);},
  ready(i){tone(i===0?880:587,.18,'triangle',.18);},
  timeup(){tone(440,.35,'sawtooth',.08,0,220);},
  reveal(){[523,659,784,1047].forEach((f,i)=>tone(f,.35,'triangle',.16,i*.08));},
  whoosh(){tone(200,.5,'sine',.08,0,900);},
  fanfare(){[[523,0],[659,.15],[784,.3],[1047,.45],[784,.62],[1047,.78]].forEach(([f,w])=>{tone(f,.4,'triangle',.18,w);tone(f/2,.4,'sine',.1,w);});[523,659,784,1047].forEach(f=>tone(f,1.6,'triangle',.08,.95));},
  drum(){for(let i=0;i<14;i++)tone(120+i*6,.07,'triangle',.06+i*.006,i*.07);},
  startLoop(){ api.stopLoop(); const a=ctx(); if(!a) return; let step=0; const notes=[220,277.2,329.6,277.2,246.9,293.7,370,293.7];
   loop=setInterval(()=>{ if(muted) {step++;return;} tone(notes[step%8],.22,'triangle',.05); if(step%4===0) tone(110,.4,'sine',.07); step++; },260); },
  stopLoop(){ if(loop){clearInterval(loop);loop=null;} }
 };
 return api;
})();

const IS_PLAYER = params.has('join') || params.has('play');
document.addEventListener('pointerdown', ()=>Sound.unlock(), {once:false});

function peerOpts(){ return {debug:1, config:{iceServers:[
  {urls:'stun:stun.l.google.com:19302'},{urls:'stun:global.stun.twilio.com:3478'},
  {urls:['turn:eu-0.turn.peerjs.com:3478','turn:us-0.turn.peerjs.com:3478'],username:'peerjs',credential:'peerjsp'}]}}; }

function Host(){
 const N = QUESTIONS.length;
 const H = { pin:null, peer:null, players:new Map(), phase:'boot', qi:-1, qStart:0, qEnd:0, raf:0, timer:null, net:'connecting', restored:false };
 window.__host = H;
 const app = $('#app');
 const SAVE_KEY = 'tq-host-state';

 function save(){ try{ localStorage.setItem(SAVE_KEY, JSON.stringify({ts:Date.now(), pin:H.pin, qi:H.qi, phase:H.phase,
   players:[...H.players.values()].map(p=>({cid:p.cid,name:p.name,score:p.score,streak:p.streak,prevScore:p.prevScore,lastPts:p.lastPts,answers:p.answers,lastResult:p.lastResult}))})); }catch(e){} }
 function load(){ try{ const s=JSON.parse(localStorage.getItem(SAVE_KEY)||'null'); if(s && Date.now()-s.ts < 3*3600e3 && s.phase!=='end') return s; }catch(e){} return null; }
 function clearSave(){ localStorage.removeItem(SAVE_KEY); }

 function joinURL(){
  let base = PUBLIC_URL && !PUBLIC_URL.startsWith('__') ? PUBLIC_URL : (location.origin + location.pathname);
  if (base.startsWith('file:')) base = location.href.split('?')[0];
  return base + (base.includes('?')?'&':'?') + 'join=' + H.pin;
 }
 const isLocalFile = () => location.protocol==='file:' && !(PUBLIC_URL && !PUBLIC_URL.startsWith('__'));

 /* ---------- רשת ---------- */
 function newPin(){ return String(100000 + Math.floor(Math.random()*900000)); }
 function openPeer(pin, attempt=0){
  H.pin = pin; H.net='connecting'; updateStatus();
  const peer = new Peer(ID_PREFIX + pin, peerOpts());
  H.peer = peer;
  peer.on('open', ()=>{ H.net='ok'; updateStatus(); if(H.phase==='boot'){ H.phase='lobby'; render(); } });
  peer.on('connection', onConn);
  peer.on('disconnected', ()=>{ H.net='bad'; updateStatus(); setTimeout(()=>{ if(!peer.destroyed && peer.disconnected) try{peer.reconnect();}catch(e){} }, 1500); });
  peer.on('error', e=>{
   console.warn('host peer error', e.type, e);
   if (e.type==='unavailable-id'){
     peer.destroy();
     if (H.restored && attempt<8) setTimeout(()=>openPeer(pin, attempt+1), 2500); // הקוד הישן עוד תפוס – מנסים שוב
     else { H.restored=false; openPeer(newPin()); }
     return;
   }
   if (['network','server-error','socket-error','socket-closed'].includes(e.type)){ H.net='bad'; updateStatus(); setTimeout(()=>{ if(peer.destroyed) return; if(peer.disconnected) try{peer.reconnect();}catch(_){} }, 3000); }
  });
 }
 function onConn(conn){
  conn.on('data', m=>onMsg(conn,m));
  conn.on('close', ()=>dropConn(conn));
  conn.on('error', ()=>dropConn(conn));
 }
 function dropConn(conn){ const p=conn._player; if(p && p.conn===conn){ p.connected=false; refreshPlayers(); } }
 function send(p,m){ if(p.conn && p.conn.open){ try{ p.conn.send(m); }catch(e){} } }
 function broadcast(fn){ for(const p of H.players.values()) if(p.connected) send(p, typeof fn==='function'?fn(p):fn); }

 function uniqueName(raw, cid){
  let base = String(raw||'').replace(/[\u0000-\u001f<>]/g,'').replace(/\s+/g,' ').trim().slice(0,16);
  if(!base) return null;
  const taken = n => [...H.players.values()].some(p=>p.cid!==cid && p.name.toLowerCase()===n.toLowerCase());
  let name=base, k=2; while(taken(name)) name = base.slice(0,13)+' '+(k++);
  return name;
 }
 function onMsg(conn, m){
  if(!m || typeof m!=='object') return;
  if(m.t==='ping'){ try{conn.send({t:'pong'});}catch(e){} const p=conn._player; if(p){p.seen=Date.now(); if(!p.connected && p.conn===conn){p.connected=true;refreshPlayers();}} return; }
  if(m.t==='join'){
   const cid = String(m.cid||'').slice(0,40); if(!cid) return;
   let p = H.players.get(cid);
   if(p){ // חזרה של שחקן קיים
     if(p.conn && p.conn!==conn) try{p.conn.close();}catch(e){}
     p.conn=conn; p.connected=true; p.seen=Date.now(); conn._player=p;
   } else {
     const name = uniqueName(m.name, cid);
     if(!name){ conn.send({t:'error', msg:'יש להקליד שם'}); return; }
     p = {cid, name, score:0, prevScore:0, streak:0, lastPts:0, answers:{}, conn, connected:true, seen:Date.now(), lastResult:null, isNew:true};
     conn._player=p; H.players.set(cid,p);
     Sound.join();
   }
   send(p,{t:'welcome', name:p.name, score:p.score});
   syncPlayer(p); refreshPlayers(); save();
   return;
  }
  const p = conn._player; if(!p) return;
  p.seen=Date.now();
  if(m.t==='answer'){
   if(H.phase!=='question' || m.qi!==H.qi || p.answers[H.qi]) return;
   const a = m.a|0; if(a<0||a>3) return;
   const tms = Math.max(0, Math.min(Date.now()-H.qStart, QUESTIONS[H.qi].t*1000));
   p.answers[H.qi] = {a, t:tms};
   send(p,{t:'ack', qi:H.qi, a});
   Sound.answer(); updateAnswered(); save();
   const live=[...H.players.values()].filter(x=>x.connected);
   if(live.length && live.every(x=>x.answers[H.qi])) { clearTimeout(H.timer); H.timer=setTimeout(endQuestion, 700); }
  }
 }
 function qPayload(){ const Q=QUESTIONS[H.qi]; return {t:'question', qi:H.qi, total:N, q:Q.q, o:Q.o, endsIn:Math.max(0,H.qEnd-Date.now()), dur:Q.t*1000}; }
 function syncPlayer(p){
  switch(H.phase){
   case 'lobby': send(p,{t:'lobby'}); break;
   case 'ready': send(p,{t:'ready', qi:H.qi, total:N}); break;
   case 'question': { const pl=qPayload(); const a=p.answers[H.qi]; if(a) pl.answered=a.a; send(p,pl); break; }
   case 'reveal': case 'leaderboard': send(p, p.lastResult || {t:'wait'}); break;
   case 'end': send(p, finalFor(p)); break;
  }
 }
 // מעקב חיבור
 setInterval(()=>{ const now=Date.now(); let ch=false; for(const p of H.players.values()){ if(p.connected && now-p.seen>14000){p.connected=false;ch=true;} } if(ch) refreshPlayers(); }, 3000);

 /* ---------- זרימת משחק ---------- */
 function ranking(key='score'){ return [...H.players.values()].sort((a,b)=>b[key]-a[key] || a.name.localeCompare(b.name,'he')); }
 function startGame(){ if(H.players.size===0) return; for(const p of H.players.values()){p.score=0;p.prevScore=0;p.streak=0;p.answers={};p.lastPts=0;p.lastResult=null;} H.qi=-1; nextQuestion(); }
 function nextQuestion(){
  clearTimeout(H.timer);
  H.qi++; if(H.qi>=N) return showPodium();
  H.phase='ready'; save(); render(); Sound.stopLoop();
  broadcast({t:'ready', qi:H.qi, total:N});
  [0,1,2].forEach(i=>setTimeout(()=>{ if(H.phase==='ready') Sound.ready(i===2?0:1); }, i*1000+300));
  H.timer=setTimeout(startQuestion, READY_MS);
 }
 function startQuestion(){
  clearTimeout(H.timer);
  const Q=QUESTIONS[H.qi]; H.phase='question'; H.qStart=Date.now(); H.qEnd=H.qStart+Q.t*1000; save();
  render(); broadcast(qPayload()); Sound.startLoop();
  H.timer=setTimeout(endQuestion, Q.t*1000+150);
 }
 function endQuestion(){
  if(H.phase!=='question') return;
  clearTimeout(H.timer); cancelAnimationFrame(H.raf); Sound.stopLoop();
  const Q=QUESTIONS[H.qi], dur=Q.t*1000;
  const before = ranking('score'); before.forEach((p,i)=>p.prevRank=i+1);
  for(const p of H.players.values()){
   const a=p.answers[H.qi]; let pts=0, ok=false;
   if(a && a.a===Q.c){ ok=true; p.streak++; pts=Math.round(1000*(1-(a.t/dur)/2)); pts+=Math.min(p.streak-1,3)*100; }
   else p.streak=0;
   p.prevScore=p.score; p.score+=pts; p.lastPts=pts; p.lastOk=ok;
  }
  const after=ranking('score'); after.forEach((p,i)=>p.rank=i+1);
  after.forEach((p,i)=>{ const a=p.answers[H.qi]; const ahead=i>0?after[i-1]:null;
   p.lastResult={t:'result', qi:H.qi, total:N, answered:!!a, choice:a?a.a:-1, correct:p.lastOk, pts:p.lastPts, score:p.score, streak:p.streak, rank:i+1, of:after.length,
     c:Q.c, cText:Q.o[Q.c], ahead: ahead?{name:ahead.name, gap:ahead.score-p.score}:null}; });
  H.phase='reveal'; save(); render(); Sound.timeup(); setTimeout(()=>Sound.reveal(),350);
  broadcast(p=>p.lastResult);
 }
 function showLeaderboard(){ H.phase='leaderboard'; save(); render(); Sound.whoosh(); }
 function finalFor(p){ const r=ranking(); const i=r.indexOf(p); return {t:'final', rank:i+1, of:r.length, score:p.score, correct:Object.keys(p.answers).filter(k=>p.answers[k].a===QUESTIONS[k].c).length, total:N}; }
 function showPodium(){ clearTimeout(H.timer); cancelAnimationFrame(H.raf); Sound.stopLoop(); H.phase='end'; clearSave(); render(); broadcast(p=>finalFor(p)); }
 function primary(){ // מקש רווח / כפתור "הבא"
  if(H.phase==='lobby') startGame();
  else if(H.phase==='ready') startQuestion();
  else if(H.phase==='question') endQuestion();
  else if(H.phase==='reveal') showLeaderboard();
  else if(H.phase==='leaderboard') nextQuestion();
 }
 function confirmEnd(){
  modal('לסיים את המשחק?','נעבור ישר לפודיום עם הניקוד הנוכחי.','סיום ופודיום', ()=>{ if(H.phase==='question'){ endQuestion(); } showPodium(); });
 }
 function newGame(){ modal('משחק חדש?','כל השחקנים והניקוד יימחקו, ויווצר קוד משחק חדש.','משחק חדש', ()=>{ broadcast({t:'kicked', msg:'המשחק הסתיים. תודה ששיחקתם!'}); clearSave(); location.href=location.pathname; }); }
 function modal(title,text,okLabel,onOk){
  const m=document.createElement('div'); m.className='modal';
  m.innerHTML=`<div class="box anim-pop"><h3>${esc(title)}</h3><p>${esc(text)}</p><div class="row"><button class="btn btn-primary" data-ok>${esc(okLabel)}</button><button class="btn btn-ghost" data-no>ביטול</button></div></div>`;
  document.body.appendChild(m);
  m.querySelector('[data-ok]').onclick=()=>{m.remove();onOk();}; m.querySelector('[data-no]').onclick=()=>m.remove();
  m.onclick=e=>{ if(e.target===m) m.remove(); };
 }
 document.addEventListener('keydown', e=>{

function Player(){
 const app=$('#app');
 const P={pin:(params.get('join')||'').replace(/\D/g,'').slice(0,6), cid:null, name:'', peer:null, conn:null, everJoined:false, kicked:false, retryT:null, retries:0, lastPong:0, score:0, state:null, qi:-1, tbarRaf:0};
 window.__player=P;
 const key = k => `tq-${k}-${P.pin}`;
 function getCid(){ let c=localStorage.getItem(key('cid')); if(!c){ c=(crypto.randomUUID?crypto.randomUUID():String(Math.random()).slice(2)+Date.now()); localStorage.setItem(key('cid'),c);} return c; }

 function top(){ return `<div class="ply-top"><img class="logo" src="${LOGO}" alt="טכנודע">${P.everJoined?`<div class="me glass"><span class="dot" style="--c:${colorFor(P.name)}">${initial(P.name)}</span><span>${esc(P.name)}</span>·<b id="myscore">${fmt(P.score)}</b></div>`:''}</div>`; }
 function screen(html){ cancelAnimationFrame(P.tbarRaf); app.innerHTML=`<div class="ply">${top()}<div class="ply-body">${html}</div></div>`; }

 function showJoin(err=''){
  const fromLink = !!P.pin && params.has('join');
  const savedName = P.pin ? (localStorage.getItem(key('name'))||'') : '';
  screen(`<div class="join-hero anim-rise"><div class="planet" style="background-image:url(${TITAN})"></div><h1>משימת טיטאן</h1><p>חידון הסיכום של מערך 12</p></div>
   <form class="form anim-rise" id="jf" style="animation-delay:.1s" autocomplete="off">
    ${fromLink?`<div class="pinchip glass">קוד משחק <b>${P.pin}</b></div>`:`<div class="field"><label for="pin">קוד משחק</label><input class="inp pin" id="pin" inputmode="numeric" maxlength="6" placeholder="000000" value="${esc(P.pin)}"></div>`}
    <div class="field"><label for="nm">השם שלך</label><input class="inp" id="nm" maxlength="16" placeholder="איך יקראו לך על המסך?" value="${esc(savedName)}" enterkeyhint="go"></div>
    <div class="err" id="err">${esc(err)}</div>
    <button class="pbtn" id="go" type="submit">יוצאים למשימה</button>
   </form><div style="flex:1"></div><div class="ply-foot">טכנודע · המוזיאון הישראלי לרפואה ומדע, חדרה</div>`);
  const nm=$('#nm'); if(!('ontouchstart' in window)) nm.focus();
  $('#jf').onsubmit=e=>{ e.preventDefault();
   const pin = fromLink?P.pin:($('#pin').value||'').replace(/\D/g,'');
   const name=nm.value.replace(/\s+/g,' ').trim();
   if(pin.length!==6) return $('#err').textContent='קוד המשחק צריך להיות בן 6 ספרות';
   if(name.length<2) return $('#err').textContent='כתבו שם (לפחות 2 אותיות)';
   P.pin=pin; P.name=name; localStorage.setItem(key('name'),name); P.cid=getCid();
   $('#go').disabled=true; $('#go').textContent='מתחברים…'; connect();
  };
 }
 function banner(on){ let b=$('.banner'); if(on){ if(!b){ b=document.createElement('div'); b.className='banner'; b.innerHTML='<div class="spinner"></div><span>החיבור נותק – מתחברים מחדש…</span>'; document.body.appendChild(b);} } else b?.remove(); }

 function cleanup(){ const c=P.conn, pe=P.peer; P.conn=null; P.peer=null; try{c&&c.close();}catch(e){} try{pe&&pe.destroy();}catch(e){} }
 function connect(){
  clearTimeout(P.retryT); cleanup();
  const peer=new Peer(peerOpts()); P.peer=peer;
  let opened=false;
  const live=()=>P.peer===peer;
  const to=setTimeout(()=>{ if(!opened && live()) lost('timeout'); }, 12000);
  peer.on('open', ()=>{
   if(!live()) return;
   const conn=peer.connect(ID_PREFIX+P.pin, {reliable:true, serialization:'json'}); P.conn=conn;
   conn.on('open', ()=>{ opened=true; clearTimeout(to); P.lastPong=Date.now(); conn.send({t:'join', cid:P.cid, name:P.name}); });
   conn.on('data', m=>{ if(P.conn===conn) onData(m); });
   conn.on('close', ()=>{ if(P.conn===conn) lost('close'); });
   conn.on('error', ()=>{ if(P.conn===conn) lost('error'); });
  });
  peer.on('error', e=>{
   if(!live()) return;
   console.warn('player peer error', e.type);
   if(e.type==='peer-unavailable' && !P.everJoined){ clearTimeout(to); cleanup(); showJoin('לא נמצא משחק פעיל עם הקוד הזה. בדקו את הקוד ונסו שוב.'); return; }
   lost(e.type);
  });
  peer.on('disconnected', ()=>{ if(!live()) return; /* נותק מהשרת המתווך – החיבור הישיר עשוי להמשיך */ if(!P.conn||!P.conn.open) lost('disc'); });
 }
 function lost(why){
  if(P.kicked) return;
  if(!P.everJoined && why==='timeout'){ cleanup(); showJoin('החיבור נכשל. בדקו שיש אינטרנט ונסו שוב.'); return; }
  if(P.retryT) return;
  banner(true);
  const wait=Math.min(5000, 800*Math.pow(1.6,P.retries++));
  P.retryT=setTimeout(()=>{ P.retryT=null; connect(); }, wait);
 }
 setInterval(()=>{ if(P.conn&&P.conn.open){ try{P.conn.send({t:'ping'});}catch(e){} if(Date.now()-P.lastPong>13000) lost('stale'); } }, 4000);
 document.addEventListener('visibilitychange', ()=>{ if(document.visibilityState==='visible' && P.everJoined && !(P.conn&&P.conn.open)) { clearTimeout(P.retryT); P.retryT=null; connect(); } });

 function onData(m){
  if(!m||typeof m!=='object') return;
  P.lastPong=Date.now();
  if(m.t==='pong') return;
  if(m.t!=='error' && m.t!=='kicked'){ banner(false); P.retries=0; }
  switch(m.t){
   case 'welcome': P.everJoined=true; P.name=m.name; P.score=m.score; localStorage.setItem(key('joined'),'1'); break;
   case 'error': showJoin(m.msg); break;
   case 'lobby': sLobby(); break;
   case 'ready': sReady(m); break;
   case 'question': sQuestion(m); break;
   case 'ack': sAnswered(m.a); break;
   case 'result': P.score=m.score; sResult(m); break;
   case 'wait': sWait(); break;
   case 'final': P.score=m.score; sFinal(m); break;
   case 'kicked': P.kicked=true; localStorage.removeItem(key('joined')); localStorage.removeItem(key('cid')); cleanup(); banner(false); screen(`<div class="center"><div class="h1p">להתראות!</div><div class="pp">${esc(m.msg||'')}</div></div>`); break;
  }
 }
 function sLobby(){ screen(`<div class="center"><div class="bigicon anim-pop" style="background:linear-gradient(135deg,var(--green),#4E8E1E)">${ICON.check}</div>
   <div class="h1p anim-rise">נכנסת למשימה!</div><div class="namebadge glass anim-rise"><span class="dot" style="--c:${colorFor(P.name)}">${initial(P.name)}</span>${esc(P.name)}</div>
   <div class="pp anim-rise">השם שלך מופיע עכשיו על המסך. מחכים שהמורה יתחיל…</div><div class="dots3"><i></i><i></i><i></i></div></div>`); }
 function sWait(){ screen(`<div class="center"><div class="dots3"><i></i><i></i><i></i></div><div class="pp">מחכים לשאלה הבאה…</div></div>`); }
 function sReady(m){ screen(`<div class="center"><div class="pp" style="color:var(--titan);font-weight:700">שאלה ${m.qi+1} מתוך ${m.total}</div><div class="h1p anim-pop" style="font-size:38px">התכוננו…</div>
   <div class="bigicon" style="background:rgba(255,255,255,.08);animation:pulse 1s infinite">${ICON.hour}</div><div class="pp">הסתכלו על המסך – התשובות מגיעות!</div></div>`); }
 function sQuestion(m){
  P.qi=m.qi; P.qEndLocal=Date.now()+m.endsIn; P.qDur=m.dur;
  if(m.answered!=null) return sAnswered(m.answered);
  if(m.endsIn<=0) return sWait();
  screen(`<div class="pq-head"><div class="pq-meta"><span>שאלה ${m.qi+1} מתוך ${m.total}</span><span id="psec"></span></div><div class="pq-text">${esc(m.q)}</div><div class="tbar"><i id="tb"></i></div></div>
   <div class="ptiles">${m.o.map((o,i)=>`<button class="ptile c${i}" data-a="${i}">${shape(i)}<span>${esc(o)}</span></button>`).join('')}</div>`);
  app.querySelectorAll('.ptile').forEach(b=>b.onclick=()=>{ const a=+b.dataset.a; try{P.conn.send({t:'answer', qi:P.qi, a});}catch(e){} navigator.vibrate?.(30); sAnswered(a, true); });
  const f=()=>{ const rem=Math.max(0,P.qEndLocal-Date.now()); const tb=$('#tb'); if(!tb) return; tb.style.transform=`scaleX(${rem/P.qDur})`; $('#psec').textContent=Math.ceil(rem/1000)+' שנ׳'; if(rem>0) P.tbarRaf=requestAnimationFrame(f); else sTimeUp(); };
  P.tbarRaf=requestAnimationFrame(f);
 }
 function sTimeUp(){ screen(`<div class="center"><div class="bigicon anim-pop" style="background:rgba(255,255,255,.1)">${ICON.clock}</div><div class="h1p">הזמן נגמר!</div><div class="pp">מיד נראה מה התשובה הנכונה…</div></div>`); }
 function sAnswered(a, local){ if(!local && $('.chosen')) return; screen(`<div class="center"><div class="chosen c${a}">${shape(a)}</div><div class="h1p anim-rise">התשובה נשלחה!</div><div class="pp anim-rise">מחכים לשאר החוקרים…</div><div class="dots3"><i></i><i></i><i></i></div></div>`); }
 function sResult(m){
  cancelAnimationFrame(P.tbarRaf);
  const cls = m.correct?'ok':(m.answered?'no':'none');
  const head = m.correct?'נכון!':(m.answered?'לא נכון':'לא הספקת');
  const ic = m.correct?ICON.check:(m.answered?ICON.x:ICON.clock);
  const behind = m.rank===1 ? 'את/ה במקום הראשון!' : (m.ahead? `עוד ${fmt(m.ahead.gap)} נק׳ כדי לעקוף את ${esc(m.ahead.name)}`:'');
  app.innerHTML=`<div class="fb ${cls}">${top()}<div class="center">
   <div class="ring2">${ic}</div><h2>${head}</h2>
   ${m.correct?`<div class="pts"><bdi class="n">+${fmt(m.pts)}</bdi> נקודות</div>`:''}
   ${m.correct&&m.streak>=2?`<div class="streakb">${ICON.flame.replace('<svg','<svg style="fill:#FFD34D"')}רצף של ${m.streak} תשובות נכונות</div>`:''}
   ${!m.correct?`<div class="correct">התשובה הנכונה: <b>${esc(m.cText)}</b></div>`:''}
   <div class="rankcard"><div class="r">מקום ${m.rank}${m.of>1?` <span style="font-size:16px;opacity:.75;font-weight:600">מתוך ${m.of}</span>`:''}</div><div class="s">${fmt(m.score)} נקודות${behind?` · ${behind}`:''}</div></div>
   </div></div>`;
  if(m.correct) navigator.vibrate?.([40,60,40]); else navigator.vibrate?.(200);
 }
 function sFinal(m){
  const msg = m.rank===1?'אלופ/ת המשימה!':m.rank<=3?'על הפודיום!':'כל הכבוד, חוקר/ת!';
  screen(`<div class="center"><div class="final-medal">${m.rank<=3?medal(m.rank):`<div class="bigicon" style="width:150px;height:150px;background:linear-gradient(135deg,var(--purple),var(--blue))"><span style="font-size:56px;font-weight:900">${m.rank}</span></div>`}</div>
   <div class="h1p">${msg}</div><div class="pp">סיימת במקום <b style="color:#fff">${m.rank}</b> מתוך ${m.of}</div>
   <div class="namebadge glass">${fmt(m.score)} נקודות</div><div class="pp">${m.correct} תשובות נכונות מתוך ${m.total}</div></div>`);
  if(m.rank<=3) setTimeout(()=>Confetti.burst(140,.5,.3),300);
 }

 // אתחול: אם כבר הצטרפנו למשחק הזה (רענון / נעילת מסך) – מתחברים מחדש אוטומטית
 if(P.pin && localStorage.getItem(key('joined')) && localStorage.getItem(key('cid')) && localStorage.getItem(key('name'))){
  P.cid=getCid(); P.name=localStorage.getItem(key('name')); P.everJoined=true;
  screen(`<div class="center"><div class="spinner" style="width:44px;height:44px"></div><div class="pp">מתחברים מחדש למשחק…</div></div>`); connect();
 } else showJoin();
}

if(IS_PLAYER) Player(); else Host();
</script>
</body></html>
