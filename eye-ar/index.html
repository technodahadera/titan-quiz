<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0f3d4a">
<title>התמונה שמתעוררת לחיים · בדיקת חדות ראייה · טכנודע</title>
<style>
@font-face{font-family:'Rubik';font-style:normal;font-weight:300 900;font-display:swap;src:url(assets/fonts/rubik-hebrew.woff2) format('woff2');unicode-range:U+0307-0308,U+0590-05FF,U+200C-2010,U+20AA,U+25CC,U+FB1D-FB4F}
@font-face{font-family:'Rubik';font-style:normal;font-weight:300 900;font-display:swap;src:url(assets/fonts/rubik-latin.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
:root{--teal:#1aa39a;--deep:#0f3d4a;--cream:#fff8ec}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#000;font-family:'Rubik',system-ui,Arial,sans-serif;color:#fff}
#ar{position:fixed;inset:0;z-index:0;overflow:hidden}
#start{position:fixed;inset:0;z-index:30;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:24px;text-align:center;
  background:radial-gradient(circle at 50% 30%,#1d6b78 0%,var(--deep) 70%)}
#start img.logo{width:min(220px,55vw);background:#fff;border-radius:14px;padding:8px 12px}
#start h1{margin:0;font-size:clamp(24px,6.5vw,38px);font-weight:700;line-height:1.2}
#start p{margin:0;font-size:clamp(16px,4.4vw,20px);opacity:.92;max-width:28em;line-height:1.45}
#go{font:inherit;font-size:clamp(26px,8vw,40px);font-weight:700;color:var(--deep);background:var(--cream);border:0;border-radius:999px;
  padding:.55em 1.8em;box-shadow:0 8px 0 #c9b98f,0 12px 30px rgba(0,0,0,.35);cursor:pointer}
#go:active{transform:translateY(4px);box-shadow:0 4px 0 #c9b98f}
#go[disabled]{opacity:.6}
#start a{color:#bfeee9;font-size:15px}
#hint{position:fixed;left:50%;bottom:calc(28px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:20;display:none;
  background:rgba(15,61,74,.86);border:2px solid var(--teal);border-radius:16px;padding:12px 20px;font-size:clamp(18px,5vw,24px);font-weight:700;white-space:nowrap;
  backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
#hint.show{display:block}
#frame{position:fixed;left:50%;top:45%;width:min(78vw,78vh*1.5);aspect-ratio:3/2;transform:translate(-50%,-50%);z-index:15;display:none;
  border:3px dashed rgba(255,255,255,.75);border-radius:14px;pointer-events:none;animation:pulse 1.6s ease-in-out infinite}
#frame.show{display:block}
@keyframes pulse{50%{opacity:.35}}
#badge{position:fixed;top:calc(10px + env(safe-area-inset-top));right:10px;z-index:20;width:110px;background:rgba(255,255,255,.92);border-radius:10px;padding:4px 8px;display:none}
#badge.show{display:block}
#msg{position:fixed;inset:0;z-index:40;display:none;align-items:center;justify-content:center;padding:28px;text-align:center;background:var(--deep);font-size:20px;line-height:1.5}
#msg.show{display:flex}
#vid{position:fixed;width:2px;height:2px;opacity:0;pointer-events:none;left:0;top:0}
</style>
<script type="importmap">
{"imports":{
  "three":"./vendor/three@0.160.0/three.module.js",
  "three/addons/":"./vendor/three@0.160.0/addons/",
  "mindar-image-three":"./vendor/mind-ar@1.2.5/mindar-image-three.prod.js"
}}
</script>
</head>
<body>
<div id="ar"></div>
<video id="vid" muted playsinline webkit-playsinline loop preload="auto" crossorigin="anonymous" poster="assets/poster.jpg">
  <source src="assets/anim.mp4" type="video/mp4">
  <source src="assets/anim.webm" type="video/webm">
</video>

<div id="start">
  <img class="logo" src="assets/logo.png" alt="טכנודע">
  <h1>התמונה שמתעוררת לחיים</h1>
  <p>לוחצים על „התחלה”, מאשרים גישה למצלמה, ומכוונים את הטלפון לתמונה המודפסת של בדיקת חדות הראייה.</p>
  <button id="go" type="button">התחלה</button>
  <a href="print-target.pdf" target="_blank" rel="noopener">להדפסת התמונה (למורה)</a>
</div>

<div id="frame"></div>
<div id="hint">כוונו את המצלמה לתמונה</div>
<img id="badge" src="assets/logo.png" alt="טכנודע">
<div id="msg"></div>

<script type="module">
import * as THREE from 'three';
import { MindARThree } from 'mindar-image-three';

const $ = (id) => document.getElementById(id);
const video = $('vid');
const state = window.__arState = { started:false, found:false, foundCount:0, error:null };

function showMsg(html){ $('msg').innerHTML = html; $('msg').classList.add('show'); }
function scanning(on){ $('hint').classList.toggle('show', on); $('frame').classList.toggle('show', on); }

if (!window.isSecureContext) {
  showMsg('הדף צריך להיפתח בכתובת מאובטחת (https) כדי להשתמש במצלמה.');
}

let mindar = null, plane = null, fade = 0, target = 0;

async function start(){
  const btn = $('go'); btn.disabled = true; btn.textContent = 'רגע...';
  // Unlock video playback inside the user gesture (needed for iOS Safari)
  try { video.muted = true; await video.play(); video.pause(); video.currentTime = 0; } catch(e) { console.warn('video unlock', e); }

  mindar = new MindARThree({
    container: $('ar'),
    imageTargetSrc: './targets.mind',
    uiLoading: 'no', uiScanning: 'no', uiError: 'no',
    filterMinCF: 0.0005, filterBeta: 1000,
    missTolerance: 8, warmupTolerance: 3,
  });
  const { renderer, scene, camera } = mindar;
  if (/[?&]debug\b/.test(location.search)) window.__mindar = mindar;

  const tex = new THREE.VideoTexture(video);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.minFilter = THREE.LinearFilter; tex.magFilter = THREE.LinearFilter; tex.generateMipmaps = false;
  // Target width = 1 unit in MindAR; the print is 3:2, so height = 2/3
  const mat = new THREE.MeshBasicMaterial({ map: tex, transparent: true, opacity: 0, toneMapped: false });
  plane = new THREE.Mesh(new THREE.PlaneGeometry(1, 2/3), mat);
  const anchor = mindar.addAnchor(0);
  anchor.group.add(plane);

  anchor.onTargetFound = () => {
    state.found = true; state.foundCount++; target = 1; scanning(false);
    video.play().catch(e => console.warn('play', e));
  };
  anchor.onTargetLost = () => {
    state.found = false; target = 0; scanning(true);
    video.pause();
  };

  try {
    await mindar.start();
  } catch (e) {
    state.error = String(e && e.message || e);
    console.error(e);
    showMsg('לא הצלחנו לפתוח את המצלמה.<br>צריך לאשר גישה למצלמה בהגדרות הדפדפן, ואז לרענן את הדף.');
    return;
  }
  state.started = true;
  $('start').style.display = 'none';
  $('badge').classList.add('show');
  scanning(true);

  let last = performance.now();
  renderer.setAnimationLoop(() => {
    const now = performance.now(), dt = Math.min(0.1, (now - last) / 1000); last = now;
    fade += (target - fade) * Math.min(1, dt * 8);
    mat.opacity = fade;
    renderer.render(scene, camera);
  });
}

$('go').addEventListener('click', start);
document.addEventListener('visibilitychange', () => { if (document.hidden) video.pause(); else if (state.found) video.play().catch(()=>{}); });
</script>
</body>
</html>
